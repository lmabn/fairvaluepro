name: Sitemap lastmod

# Prüft in jedem PR gegen main, dass die lastmod-Werte in sitemap.xml
# mit dem letzten Commit übereinstimmen, der die jeweilige Datei
# ändert. Pusht nichts — der Autor des PRs lässt vor dem Push
# `python3 .github/workflows/sitemap_lastmod.py` lokal laufen und
# committet sitemap.xml mit.

on:
  pull_request:
    branches: [main]
    paths:
      - '**.html'
      - 'sitemap.xml'
      - '.github/workflows/sitemap_lastmod.py'
      - '.github/workflows/sitemap_lastmod.yml'
  workflow_dispatch:

concurrency:
  group: sitemap-lastmod-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout mit voller Historie
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: lastmod gegen Versionsgeschichte prüfen
        run: python3 .github/workflows/sitemap_lastmod.py --check
