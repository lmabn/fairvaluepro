name: Sitemap lastmod

# Nach jedem Push auf main die lastmod-Werte in sitemap.xml automatisch
# aus der Versionsgeschichte setzen (letzter Commit, der die jeweilige
# Datei ändert). Keine sichtbare Wirkung — nur Datumspflege.

on:
  push:
    branches: [main]
    paths:
      - '**.html'
  workflow_dispatch:

concurrency:
  group: sitemap-lastmod-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    # Nicht laufen, wenn der Commit selbst von diesem Workflow stammt
    # (Marker im Commit-Titel).
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout mit voller Historie
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: lastmod aus git log setzen
        run: python3 .github/workflows/sitemap_lastmod.py

      - name: Änderung committen und pushen
        run: |
          if git diff --quiet -- sitemap.xml; then
            echo "sitemap.xml unverändert — nichts zu committen."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sitemap.xml
          git commit -m 'chore(sitemap): lastmod automatisch aus Versionsgeschichte [skip ci]'
          git push
