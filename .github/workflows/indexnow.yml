name: IndexNow

# Nach jedem Push auf main: geänderte Adressen aus sitemap.xml an
# api.indexnow.org melden (Bing, Yandex u. a.). Kein Konto, kein neuer
# Dienst — nur der Schlüssel aus der Datei im Wurzelverzeichnis.

on:
  push:
    branches: [main]
    paths:
      - '**.html'
      - 'sitemap.xml'
  workflow_dispatch:
    inputs:
      reindex_all:
        description: 'Alle Sitemap-URLs melden (Reindex)'
        type: boolean
        default: false

concurrency:
  group: indexnow-${{ github.ref }}
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout mit Historie
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Geänderte Sitemap-URLs sammeln und IndexNow pingen
        env:
          REINDEX_ALL: ${{ github.event.inputs.reindex_all || 'false' }}
        run: python3 .github/workflows/indexnow_ping.py
