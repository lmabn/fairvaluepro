<svg viewBox="0 0 720 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Nötiger Aufholgewinn steigt konvex mit dem Verlust: minus 50 Prozent erfordert plus 100 Prozent, minus 90 Prozent erfordert plus 900 Prozent.">
  <style>
    .svg-bg   { fill: var(--bg, #080e0b); }
    .axis     { stroke: var(--border2, rgba(0,255,135,.12)); stroke-width: 1; }
    .grid     { stroke: var(--border, rgba(0,255,135,.07)); stroke-width: 1; stroke-dasharray: 3 4; }
    .curve    { stroke: var(--neon, #00ff87); stroke-width: 2.5; fill: none; }
    .area     { fill: var(--neon-dim, rgba(0,255,135,.09)); }
    .marker   { fill: var(--neon, #00ff87); }
    .marker-l { stroke: var(--neon-border, rgba(0,255,135,.25)); stroke-width: 1; stroke-dasharray: 2 3; }
    .lbl      { fill: var(--text-2, #6a8c7a); font-family: var(--mono, ui-monospace,'SF Mono','Cascadia Code','Fira Code','Consolas',monospace); font-size: 12px; letter-spacing: .04em; }
    .lbl-neon { fill: var(--neon, #00ff87); font-family: var(--mono, ui-monospace,monospace); font-size: 12px; font-weight: 700; letter-spacing: .04em; }
    .tick     { fill: var(--text-3, #344d3e); font-family: var(--mono, ui-monospace,monospace); font-size: 10px; }
  </style>

  <rect class="svg-bg" x="0" y="0" width="720" height="400" rx="6"/>

  <!-- Gitterlinien horizontal -->
  <line class="grid" x1="70" y1="90"  x2="680" y2="90"/>
  <line class="grid" x1="70" y1="170" x2="680" y2="170"/>
  <line class="grid" x1="70" y1="250" x2="680" y2="250"/>

  <!-- Achsen -->
  <line class="axis" x1="70" y1="40" x2="70" y2="330"/>
  <line class="axis" x1="70" y1="330" x2="680" y2="330"/>

  <!-- Y-Ticks (nötiger Gewinn) -->
  <text class="tick" x="34" y="334">0%</text>
  <text class="tick" x="26" y="254">100%</text>
  <text class="tick" x="26" y="174">400%</text>
  <text class="tick" x="26" y="94">900%</text>
  <text class="tick" x="20" y="30">Nötiger</text>
  <text class="tick" x="20" y="42">Gewinn</text>

  <!-- X-Ticks (Verlust in %) -->
  <text class="tick" x="120" y="348">10</text>
  <text class="tick" x="200" y="348">30</text>
  <text class="tick" x="315" y="348">50</text>
  <text class="tick" x="430" y="348">70</text>
  <text class="tick" x="600" y="348">90</text>
  <text class="tick" x="600" y="366">Verlust %</text>

  <!-- Fläche unter der Kurve -->
  <path class="area" d="M70,330
    C160,326 240,318 315,250
    C400,175 470,120 545,90
    L620,64 L620,330 Z" opacity="0.5"/>

  <!-- Konvexe Kurve: Nötiger Gewinn = 1/(1-Verlust) - 1 -->
  <path class="curve" d="M70,330
    C160,326 240,318 315,250
    C400,175 470,120 545,90
    L620,64"/>

  <!-- Markierung -50% / +100% -->
  <line class="marker-l" x1="315" y1="330" x2="315" y2="250"/>
  <line class="marker-l" x1="70"  y1="250" x2="315" y2="250"/>
  <circle class="marker" cx="315" cy="250" r="4"/>
  <text class="lbl-neon" x="326" y="244">−50% → +100%</text>

  <!-- Markierung -90% / +900% -->
  <circle class="marker" cx="620" cy="64" r="4"/>
  <text class="lbl-neon" x="500" y="58">−90% → +900%</text>
</svg>
