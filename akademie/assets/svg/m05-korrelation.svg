<svg viewBox="0 0 720 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Links neun gleichartige Kacheln (ein Risiko mehrfach gekauft), rechts verschiedenfarbige Kacheln als echte Streuung über Sektoren.">
  <style>
    .bg     { fill: var(--bg, #080e0b); }
    .panel  { fill: var(--bg2, #0b1410); }
    .panel2 { fill: var(--bg3, #0f1a14); }
    .axis   { stroke: var(--border2, rgba(0,255,135,.12)); stroke-width: 1; fill: none; }
    .grid   { stroke: var(--border, rgba(0,255,135,.07)); stroke-width: 1; fill: none; }
    .griddash { stroke: var(--border, rgba(0,255,135,.07)); stroke-width: 1; stroke-dasharray: 3 4; fill: none; }
    .neon   { stroke: var(--neon, #00ff87); stroke-width: 2.4; fill: none; }
    .neonf  { fill: var(--neon, #00ff87); }
    .mid    { stroke: var(--mid, #00c46a); stroke-width: 2; fill: none; }
    .midf   { fill: var(--mid, #00c46a); }
    .muted  { stroke: var(--text-2, #6a8c7a); stroke-width: 1.8; fill: none; }
    .mutedf { fill: var(--text-2, #6a8c7a); }
    .warnf  { fill: var(--warn, #8fffcb); }
    .fillneon { fill: var(--neon-dim, rgba(0,255,135,.09)); }
    .fillmid  { fill: var(--mid-dim, rgba(0,196,106,.09)); }
    .fillmut  { fill: var(--muted-dim, rgba(42,102,73,.25)); }
    .box    { fill: var(--bg3, #0f1a14); stroke: var(--border2, rgba(0,255,135,.12)); stroke-width: 1; }
    .boxneon{ fill: var(--neon-dim, rgba(0,255,135,.09)); stroke: var(--neon-border, rgba(0,255,135,.25)); stroke-width: 1; }
    .t      { fill: var(--text, #c8ddd2); font-family: var(--display, 'Manrope',system-ui,sans-serif); }
    .lbl    { fill: var(--text-2, #6a8c7a); font-family: var(--mono, ui-monospace,'SF Mono','Cascadia Code','Fira Code','Consolas',monospace); font-size: 12px; letter-spacing: .04em; }
    .lbln   { fill: var(--neon, #00ff87); font-family: var(--mono, ui-monospace,monospace); font-size: 12px; letter-spacing: .04em; }
    .lbln-b { fill: var(--neon, #00ff87); font-family: var(--mono, ui-monospace,monospace); font-size: 12px; font-weight: 700; letter-spacing: .04em; }
    .tick   { fill: var(--text-3, #344d3e); font-family: var(--mono, ui-monospace,monospace); font-size: 10px; letter-spacing: .03em; }
    .head   { fill: var(--text, #c8ddd2); font-family: var(--mono, ui-monospace,monospace); font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
  </style>
  <rect class="bg" x="0" y="0" width="720" height="340" rx="6"/>

  <text class="lbl" x="200" y="50" text-anchor="middle" style="fill:var(--text-2)">Scheinbar diversifiziert</text>
  <text class="lbln" x="520" y="50" text-anchor="middle">Tatsächlich diversifiziert</text>
  <!-- alle gleich (tech) -->
  <g>
    <rect class="fillmut" x="80" y="80" width="50" height="50"/><rect class="fillmut" x="140" y="80" width="50" height="50"/><rect class="fillmut" x="200" y="80" width="50" height="50"/>
    <rect class="fillmut" x="80" y="140" width="50" height="50"/><rect class="fillmut" x="140" y="140" width="50" height="50"/><rect class="fillmut" x="200" y="140" width="50" height="50"/>
    <rect class="fillmut" x="80" y="200" width="50" height="50"/><rect class="fillmut" x="140" y="200" width="50" height="50"/><rect class="fillmut" x="200" y="200" width="50" height="50"/>
  </g>
  <text class="lbl" x="165" y="285" text-anchor="middle" style="fill:var(--text-3)">alle steigen/fallen zusammen</text>
  <text class="lbl" x="165" y="308" text-anchor="middle" style="fill:var(--text-3)">ein Risiko, 9× gekauft</text>
  <!-- verschieden -->
  <g>
    <rect class="fillneon" x="440" y="80" width="50" height="50" stroke="var(--neon-border,rgba(0,255,135,.25))"/><rect class="fillmid" x="500" y="80" width="50" height="50" stroke="var(--mid-border,rgba(0,196,106,.22))"/><rect class="box" x="560" y="80" width="50" height="50"/>
    <rect class="box" x="440" y="140" width="50" height="50"/><rect class="fillneon" x="500" y="140" width="50" height="50" stroke="var(--neon-border,rgba(0,255,135,.25))"/><rect class="fillmid" x="560" y="140" width="50" height="50" stroke="var(--mid-border,rgba(0,196,106,.22))"/>
    <rect class="fillmid" x="440" y="200" width="50" height="50" stroke="var(--mid-border,rgba(0,196,106,.22))"/><rect class="box" x="500" y="200" width="50" height="50"/><rect class="fillneon" x="560" y="200" width="50" height="50" stroke="var(--neon-border,rgba(0,255,135,.25))"/>
  </g>
  <text class="lbln" x="525" y="285" text-anchor="middle">verschiedene Treiber</text>
  <text class="lbl" x="525" y="308" text-anchor="middle" style="fill:var(--text-3)">echte Streuung</text>

</svg>
