<svg viewBox="0 0 720 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Links neun gleichartige Kacheln (ein Risiko mehrfach gekauft), rechts verschiedenfarbige Kacheln als echte Streuung über Sektoren.">
  <style>
    .bg     { fill: var(--bg, #FFFFFF); }
    .panel  { fill: var(--bg2, #F7F8FA); }
    .panel2 { fill: var(--bg3, #F1F3F5); }
    .axis   { stroke: var(--border2, rgba(17,19,23,.40)); stroke-width: 1.4; fill: none; }
    .grid   { stroke: var(--border, rgba(17,19,23,.22)); stroke-width: 1.4; fill: none; }
    .griddash { stroke: var(--border, rgba(17,19,23,.22)); stroke-width: 1.4; stroke-dasharray: 5 4; fill: none; }
    .neon   { stroke: var(--neon, #10A86E); stroke-width: 2.4; fill: none; }
    .neonf  { fill: var(--neon, #10A86E); }
    .mid    { stroke: var(--mid, #3B7BFF); stroke-width: 2; fill: none; }
    .midf   { fill: var(--mid, #3B7BFF); }
    .muted  { stroke: var(--text-2, #555A62); stroke-width: 1.8; fill: none; }
    .mutedf { fill: var(--text-2, #555A62); }
    .warnf  { fill: var(--warn, #D9480F); }
    .fillneon { fill: var(--neon-dim, rgba(16,168,110,.10)); }
    .fillmid  { fill: var(--mid-dim, rgba(59,123,255,.10)); }
    .fillmut  { fill: var(--muted-dim, rgba(17,19,23,.06)); }
    .box    { fill: var(--bg3, #F1F3F5); stroke: var(--border2, rgba(17,19,23,.40)); stroke-width: 1; }
    .boxneon{ fill: var(--neon-dim, rgba(16,168,110,.10)); stroke: var(--neon-border, rgba(16,168,110,.45)); stroke-width: 1; }
    .t      { fill: var(--text, #111317); font-family: 'Geist',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; }
    .lbl    { fill: var(--text-2, #555A62); font-family: 'Geist',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; font-size: 13px; letter-spacing: 0; }
    .lbln   { fill: var(--neon, #10A86E); font-family: 'Geist',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; font-size: 13px; letter-spacing: 0; }
    .lbln-b { fill: var(--neon, #10A86E); font-family: 'Geist',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; font-size: 13px; font-weight: 700; letter-spacing: 0; }
    .tick   { fill: var(--text-3, #7E858F); font-family: 'Geist',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; font-size: 11.5px; letter-spacing: 0; }
    .head   { fill: var(--text, #111317); font-family: 'Geist',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
  </style>
  <rect class="bg" x="0" y="0" width="720" height="340" rx="6"/>

  <text class="lbl" x="200" y="50" text-anchor="middle" style="fill:#555A62">Scheinbar diversifiziert</text>
  <text class="lbln" x="520" y="50" text-anchor="middle">Tatsächlich diversifiziert</text>
  <!-- alle gleich (tech) -->
  <g>
    <rect class="fillmut" x="80" y="80" width="50" height="50"/><rect class="fillmut" x="140" y="80" width="50" height="50"/><rect class="fillmut" x="200" y="80" width="50" height="50"/>
    <rect class="fillmut" x="80" y="140" width="50" height="50"/><rect class="fillmut" x="140" y="140" width="50" height="50"/><rect class="fillmut" x="200" y="140" width="50" height="50"/>
    <rect class="fillmut" x="80" y="200" width="50" height="50"/><rect class="fillmut" x="140" y="200" width="50" height="50"/><rect class="fillmut" x="200" y="200" width="50" height="50"/>
  </g>
  <text class="lbl" x="165" y="285" text-anchor="middle" style="fill:#7E858F">alle steigen/fallen zusammen</text>
  <text class="lbl" x="165" y="308" text-anchor="middle" style="fill:#7E858F">ein Risiko, 9× gekauft</text>
  <!-- verschieden -->
  <g>
    <rect class="fillneon" x="440" y="80" width="50" height="50" stroke="var(--neon-border,rgba(16,168,110,.45))"/><rect class="fillmid" x="500" y="80" width="50" height="50" stroke="var(--mid-border,rgba(59,123,255,.40))"/><rect class="box" x="560" y="80" width="50" height="50"/>
    <rect class="box" x="440" y="140" width="50" height="50"/><rect class="fillneon" x="500" y="140" width="50" height="50" stroke="var(--neon-border,rgba(16,168,110,.45))"/><rect class="fillmid" x="560" y="140" width="50" height="50" stroke="var(--mid-border,rgba(59,123,255,.40))"/>
    <rect class="fillmid" x="440" y="200" width="50" height="50" stroke="var(--mid-border,rgba(59,123,255,.40))"/><rect class="box" x="500" y="200" width="50" height="50"/><rect class="fillneon" x="560" y="200" width="50" height="50" stroke="var(--neon-border,rgba(16,168,110,.45))"/>
  </g>
  <text class="lbln" x="525" y="285" text-anchor="middle">verschiedene Treiber</text>
  <text class="lbl" x="525" y="308" text-anchor="middle" style="fill:#7E858F">echte Streuung</text>

</svg>
