<svg viewBox="0 0 800 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Filterkaskade der Fundamentalanalyse: vier Stufen (Verstehen, Qualität, Wert, Preis) mit Sub-Themen, Aussortier-Konsequenz und Kandidatenzahl je Stufe; von rund 500 Kandidaten bleiben etwa zwei übrig.">
  <style>
    .bg     { fill: var(--bg, #080e0b); }
    .box    { fill: var(--bg3, #0f1a14); stroke: var(--border2, rgba(0,255,135,.12)); stroke-width: 1; }
    .boxneon{ fill: var(--neon-dim, rgba(0,255,135,.09)); stroke: var(--neon-border, rgba(0,255,135,.25)); stroke-width: 1; }
    .head   { fill: var(--text, #c8ddd2); font-family: var(--mono, ui-monospace,monospace); font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
    .qneon  { fill: var(--neon, #00ff87); font-family: var(--mono, ui-monospace,monospace); font-size: 14px; font-weight: 700; letter-spacing: .04em; }
    .q      { fill: var(--text, #c8ddd2); font-family: var(--mono, ui-monospace,monospace); font-size: 14px; font-weight: 700; letter-spacing: .04em; }
    .topic  { fill: var(--text-2, #6a8c7a); font-family: var(--mono, ui-monospace,monospace); font-size: 10.5px; letter-spacing: .02em; }
    .rej    { fill: var(--text-3, #344d3e); font-family: var(--mono, ui-monospace,monospace); font-size: 10px; letter-spacing: .02em; }
    .count  { fill: var(--neon, #00ff87); font-family: var(--mono, ui-monospace,monospace); font-size: 12px; font-weight: 700; letter-spacing: .04em; }
    .arrow  { fill: var(--text-3, #344d3e); font-family: var(--mono, ui-monospace,monospace); font-size: 14px; }
  </style>
  <rect class="bg" x="0" y="0" width="800" height="640" rx="6"/>

  <text class="head" x="400" y="30" text-anchor="middle">Filterkaskade</text>

  <!-- Stage 1 — Verstehe ich es? -->
  <path class="boxneon" d="M60,50 L740,50 L700,170 L100,170 Z"/>
  <text class="qneon" x="400" y="85" text-anchor="middle">1 · Verstehe ich es?</text>
  <text class="topic" x="400" y="115" text-anchor="middle">Geschäftsmodell · Wertschöpfung · Kunden · Zyklik</text>
  <text class="rej" x="400" y="150" text-anchor="middle">✗ Nein → aussortieren. Ohne Diskussion.</text>
  <text class="count" x="720" y="115">~500</text>
  <text class="arrow" x="400" y="188" text-anchor="middle">▼</text>

  <!-- Stage 2 — Ist es gut? -->
  <path class="box" d="M100,200 L700,200 L650,320 L150,320 Z"/>
  <text class="q" x="400" y="235" text-anchor="middle">2 · Ist es gut?</text>
  <text class="topic" x="400" y="265" text-anchor="middle">Moat · Margen · ROIC · Wachstum · Bilanz · Management</text>
  <text class="rej" x="400" y="300" text-anchor="middle">✗ Nein → aussortieren. Auch wenn es billig ist.</text>
  <text class="count" x="680" y="265">~100</text>
  <text class="arrow" x="400" y="338" text-anchor="middle">▼</text>

  <!-- Stage 3 — Was ist es wert? -->
  <path class="box" d="M150,350 L650,350 L590,450 L210,450 Z"/>
  <text class="q" x="400" y="390" text-anchor="middle">3 · Was ist es wert?</text>
  <text class="topic" x="400" y="420" text-anchor="middle">DCF · Multiples · Peer-Vergleich · Historik</text>
  <text class="count" x="630" y="420">~25</text>
  <text class="arrow" x="400" y="468" text-anchor="middle">▼</text>

  <!-- Stage 4 — Günstig genug? -->
  <path class="box" d="M210,480 L590,480 L530,600 L270,600 Z"/>
  <text class="q" x="400" y="515" text-anchor="middle">4 · Günstig genug?</text>
  <text class="topic" x="400" y="545" text-anchor="middle">Sicherheitsmarge ≥ Schwellenwert?</text>
  <text class="rej" x="400" y="580" text-anchor="middle">✗ Nein → auf die Watchlist. Nicht kaufen.</text>
  <text class="count" x="560" y="545">~2</text>
</svg>
