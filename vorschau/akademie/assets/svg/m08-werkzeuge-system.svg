<svg viewBox="0 0 720 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Links verstreute Werkzeuge, rechts eine geordnete Prozesskette: aus einzelnen Werkzeugen wird ein wiederholbares System.">
  <style>
    .bg     { fill: var(--bg, #FFFFFF); }
    .panel  { fill: var(--bg2, #F7F8FA); }
    .panel2 { fill: var(--bg3, #F1F3F5); }
    .axis   { stroke: var(--border2, rgba(17,19,23,.40)); stroke-width: 1.4; fill: none; }
    .grid   { stroke: var(--border, rgba(17,19,23,.22)); stroke-width: 1.4; fill: none; }
    .griddash { stroke: var(--border, rgba(17,19,23,.22)); stroke-width: 1.4; stroke-dasharray: 5 4; fill: none; }
    .neon   { stroke: var(--neon, #10A86E); stroke-width: 2.4; fill: none; }
    .neonf  { fill: var(--neon, #10A86E); }
    .mid    { stroke: var(--mid, #3B7BFF); stroke-width: 2; fill: none; }
    .midf   { fill: var(--mid, #3B7BFF); }
    .muted  { stroke: var(--text-2, #555A62); stroke-width: 1.8; fill: none; }
    .mutedf { fill: var(--text-2, #555A62); }
    .warnf  { fill: var(--warn, #D9480F); }
    .fillneon { fill: var(--neon-dim, rgba(16,168,110,.10)); }
    .fillmid  { fill: var(--mid-dim, rgba(59,123,255,.10)); }
    .fillmut  { fill: var(--muted-dim, rgba(17,19,23,.06)); }
    .box    { fill: var(--bg3, #F1F3F5); stroke: var(--border2, rgba(17,19,23,.40)); stroke-width: 1; }
    .boxneon{ fill: var(--neon-dim, rgba(16,168,110,.10)); stroke: var(--neon-border, rgba(16,168,110,.45)); stroke-width: 1; }
    .t      { fill: var(--text, #111317); font-family: 'Geist',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; }
    .lbl    { fill: var(--text-2, #555A62); font-family: 'Geist',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; font-size: 13px; letter-spacing: 0; }
    .lbln   { fill: var(--neon, #10A86E); font-family: 'Geist',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; font-size: 13px; letter-spacing: 0; }
    .lbln-b { fill: var(--neon, #10A86E); font-family: 'Geist',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; font-size: 13px; font-weight: 700; letter-spacing: 0; }
    .tick   { fill: var(--text-3, #7E858F); font-family: 'Geist',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; font-size: 11.5px; letter-spacing: 0; }
    .head   { fill: var(--text, #111317); font-family: 'Geist',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
  </style>
  <rect class="bg" x="0" y="0" width="720" height="300" rx="6"/>

  <text class="lbl" x="150" y="46" text-anchor="middle" style="fill:#555A62">Werkzeuge kennen</text>
  <circle class="box" cx="90" cy="110" r="18"/><circle class="box" cx="150" cy="90" r="18"/><circle class="box" cx="210" cy="130" r="18"/>
  <circle class="box" cx="120" cy="170" r="18"/><circle class="box" cx="190" cy="200" r="18"/><circle class="box" cx="90" cy="230" r="18"/>
  <text class="tick" x="150" y="270" text-anchor="middle" style="fill:#7E858F">verstreut, situativ</text>
  <path class="neon" d="M280,160 L360,160"/><polygon class="neonf" points="365,160 351,152 351,168"/>
  <text class="lbln" x="560" y="46" text-anchor="middle">System haben</text>
  <rect class="boxneon" x="420" y="90" width="240" height="34"/><text class="lbl" x="540" y="112" text-anchor="middle" style="fill:#111317">Universum → Screening</text>
  <rect class="boxneon" x="420" y="130" width="240" height="34"/><text class="lbl" x="540" y="152" text-anchor="middle" style="fill:#111317">Bewerten → Kaufen</text>
  <rect class="boxneon" x="420" y="170" width="240" height="34"/><text class="lbl" x="540" y="192" text-anchor="middle" style="fill:#111317">Größe → Verkaufen</text>
  <text class="tick" x="540" y="240" text-anchor="middle" style="fill:#7E858F">wiederholbarer Prozess</text>

</svg>
